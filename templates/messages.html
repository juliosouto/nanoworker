{% extends "base.html" %}

{% block title %}NanoWorker - Messages{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/config.css') }}">

<style>
    .msg-toolbar { display: flex; flex-direction: row; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .msg-toolbar .msg-field { display: flex; flex-direction: column; gap: 6px; min-width: 160px; }
    .msg-toolbar .msg-field.grow { flex: 1 1 240px; }
    .msg-toolbar label { font-size: 0.8rem; color: var(--text-muted); }
    .msg-tabs { display: inline-flex; border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }
    .msg-tabs button { background: transparent; border: 0; color: var(--text-muted); padding: 8px 14px; font-size: 0.9rem; }
    .msg-tabs button.active { background: rgba(255,255,255,0.08); color: var(--text-main, #fff); font-weight: 600; }
    .msg-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
    .msg-btn { border: 1px solid var(--border-color); background: rgba(255,255,255,0.04); color: inherit; border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; }
    .msg-btn:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
    .msg-btn:disabled { opacity: 0.45; cursor: default; }
    .msg-btn.danger { border-color: rgba(239,68,68,0.5); color: #f87171; }
    .msg-group { border: 1px solid var(--border-color); border-radius: 12px; background: rgba(0,0,0,0.2); overflow: hidden; }
    .msg-group-header { padding: 10px 16px; background: rgba(255,255,255,0.05); font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .msg-row { display: grid; grid-template-columns: 24px 150px 1fr auto; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border-color); align-items: start; }
    .msg-row:first-child { border-top: 0; }
    .msg-row:hover { background: rgba(255,255,255,0.02); }
    .msg-meta { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }
    .msg-content { white-space: pre-wrap; word-break: break-word; max-height: 6em; overflow: hidden; font-size: 0.92rem; }
    .msg-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .msg-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-color); color: var(--text-muted); }
    .msg-badge.ok { color: #34d399; border-color: rgba(52,211,153,0.4); }
    .msg-badge.warn { color: #fbbf24; border-color: rgba(251,191,36,0.4); }
    .msg-badge.score { color: var(--accent-color); border-color: rgba(99,102,241,0.4); }
    .msg-empty { text-align: center; padding: 48px 16px; color: var(--text-muted); }
    @media (max-width: 640px) {
        .msg-row { grid-template-columns: 24px 1fr; }
        .msg-row .msg-meta-col, .msg-row .msg-del { grid-column: 2; }
    }
</style>

<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
        <h2 style="font-weight: 600; margin: 0;">Messages</h2>
        <span id="msgTotal" style="color: var(--text-muted); font-size: 0.9rem;"></span>
    </div>

    <div class="glass-panel msg-toolbar">
        <div class="msg-field grow">
            <label for="msgSearch">Keyword</label>
            <input id="msgSearch" class="premium-input" type="search" placeholder="Search message text…" autocomplete="off">
        </div>
        <div class="msg-field">
            <label for="msgChannel">Channel</label>
            <select id="msgChannel" class="premium-select"><option value="">All channels</option></select>
        </div>
        <div class="msg-field">
            <label>Filter</label>
            <div class="msg-tabs" role="tablist">
                <button type="button" data-mode="all" class="active">All</button>
                <button type="button" data-mode="duplicates">Duplicates</button>
                <button type="button" data-mode="similar">Similar</button>
            </div>
        </div>
        <div class="msg-field" id="msgThresholdField" style="display: none; min-width: 200px;">
            <label for="msgThreshold">Similarity &ge; <span id="msgThresholdValue">0.90</span></label>
            <input id="msgThreshold" type="range" min="0.70" max="1" step="0.01" value="0.90">
        </div>
    </div>

    <div class="msg-actions">
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button type="button" class="msg-btn" id="msgSelectPage">Select page</button>
            <button type="button" class="msg-btn" id="msgKeepNewest" style="display: none;" title="Select every message except the newest one in each group">Keep newest per group</button>
            <button type="button" class="msg-btn" id="msgClearSelection">Clear selection</button>
        </div>
        <button type="button" class="msg-btn danger" id="msgDeleteSelected" disabled>Delete selected (0)</button>
    </div>

    <div id="msgResults" style="display: flex; flex-direction: column; gap: 12px;"></div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
        <button type="button" class="msg-btn" id="msgPrev">&larr; Previous</button>
        <span id="msgPageInfo" style="color: var(--text-muted); font-size: 0.9rem;"></span>
        <button type="button" class="msg-btn" id="msgNext">Next &rarr;</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/messages.js') }}"></script>
{% endblock %}
