<header class="topbar">
    <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-nav-toggle" id="mobileNavToggle" onclick="toggleSidebar()" aria-label="Toggle Navigation">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <span class="mobile-logo-text">NanoWorker</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        {% if request.endpoint == 'dashboard' %}
        <button class="btn primary btn-sm" onclick="startNewChat()">+ New Chat</button>
        {% endif %}
    </div>
</header>
