services:
  nanoworker:
    build: .
    container_name: nanoworker
    expose:
      - "5000"
    volumes:
      - ./.env:/app/.env
      - ./nanoworker.db:/app/nanoworker.db
      - ./.store:/app/.store
      - ./models:/app/models
      - ./temp:/app/temp
    environment:
      - HOST=0.0.0.0
    restart: unless-stopped
    # Rede do Caddy da VPS (stack vps-proxy). Ela é criada por esse stack; sem ele no ar, o nanoworker não sobe.
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: proxy
