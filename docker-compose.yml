services:
  nanoworker:
    build: .
    container_name: nanoworker
    expose:
      - "5000"
    volumes:
      - ./.env:/app/.env
      - ./nanoworker.db:/app/nanoworker.db
      - ./.store:/app/.store
      - ./temp:/app/temp
    environment:
      - HOST=0.0.0.0
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: nanoworker-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nanoworker

volumes:
  caddy_data:
  caddy_config:
